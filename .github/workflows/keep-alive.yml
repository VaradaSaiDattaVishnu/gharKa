name: Keep API awake

# Best-effort BACKUP pinger for the Render free-tier API.
#
# ⚠️ THIS ALONE WILL NOT KEEP THE SERVICE UP. GitHub's scheduled crons are
# throttled and routinely delayed 15-45 min (worst around the top of the hour),
# and GitHub auto-disables scheduled workflows after 60 days with no repo
# activity. Either of those lets the 15-min idle timer expire, so the service
# sleeps and the next user hits a ~50s cold start ("it died").
#
# The RELIABLE keep-alive is an EXTERNAL uptime monitor (cron-job.org or
# UptimeRobot) hitting /api/health every 5 minutes from their own infra.
# Setup instructions: see KEEP_ALIVE.md in the repo root.
#
# This workflow stays as a no-cost safety net. Each run WAKES the service
# (retrying through a cold start) but does not try to hold it warm for long —
# that is the external monitor's job, and a long-running loop would burn far
# too many Actions minutes on a private repo.

on:
  schedule:
    - cron: "*/5 * * * *" # nominal every 5 min; GitHub runs it best-effort (often less often)
  workflow_dispatch: {} # manual "Run workflow" button

# Don't let delayed/queued runs pile up — one successful wake is all we need.
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake /api/health (retry through a cold start)
        run: |
          URL="https://gharka-api.onrender.com/api/health"
          for i in $(seq 1 8); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API is awake."
              exit 0
            fi
            sleep 15
          done
          echo "Could not confirm the API is awake (it may be deploying). Not failing the job."
          exit 0
