# Render Blueprint for the GharKa API + PostgreSQL database.
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# Render reads this file, provisions the DB + web service, and prompts only
# for the secrets marked `sync: false` below.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: gharka-db
    databaseName: gharka
    user: gharka
    plan: free
    region: singapore # closest Render region to India
    postgresMajorVersion: "16"

services:
  - type: web
    name: gharka-api # → https://gharka-api.onrender.com (matches apps/mobile/eas.json)
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /api/health
    # corepack provides the pnpm version pinned in package.json (packageManager).
    # The filter "@gharka/api..." builds @gharka/shared first, then the API.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "@gharka/api..." run build
    # Apply DB migrations (idempotent) before starting the server.
    startCommand: corepack enable && pnpm --filter @gharka/api run db:migrate && pnpm --filter @gharka/api run start
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: DATABASE_URL
        fromDatabase:
          name: gharka-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a secure random value (>=32 chars)
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # --- Secrets you must fill in the dashboard (copy from apps/api/.env) ---
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false # paste the entire contents of firebase-service-account.json
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_PHONE_NUMBERS
        sync: false # e.g. +919999999999
      # Set this to your Vercel web URL once the web app is deployed, e.g.
      # https://gharka.vercel.app  (comma-separate multiple origins, no trailing slash)
      - key: CORS_ORIGINS
        sync: false
